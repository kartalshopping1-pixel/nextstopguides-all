<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you serve the web app from a sub-folder (e.g. https://nextstopguides.com/game/)
    build with: flutter build web --base-href /game/
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="NextStop Trivia by NextStopGuides - guess countries, capitals, flags and famous landmarks. A new Daily Challenge every day!">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0E7C86">

  <!-- Social sharing preview -->
  <meta property="og:title" content="NextStop Trivia · NextStopGuides">
  <meta property="og:description" content="How well do you know the world? Countries, capitals, flags and landmarks.">
  <meta property="og:type" content="website">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NextStop Trivia">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon (generated by `flutter create .`; replace with your logo) -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>NextStop Trivia · NextStopGuides</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #0B3C5D;
    }
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #0B3C5D, #0E7C86);
    }
    #splash .plane {
      font-size: 64px;
      animation: fly 1.6s ease-in-out infinite alternate;
    }
    #splash p {
      opacity: 0.85;
      letter-spacing: 0.04em;
    }
    @keyframes fly {
      from { transform: translateY(0) rotate(-6deg); }
      to { transform: translateY(-12px) rotate(6deg); }
    }
  </style>
</head>
<body>
  <div id="splash">
    <div class="plane">✈️</div>
    <p>NextStop Trivia</p>
  </div>
  <script>
    // Remove the splash as soon as Flutter has rendered its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (splash) splash.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
