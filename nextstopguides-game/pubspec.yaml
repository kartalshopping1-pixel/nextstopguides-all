name: nextstopguides_game
description: "NextStop Trivia by NextStopGuides - a travel trivia & guessing game (countries, capitals, flags, landmarks)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

# Keep runtime dependencies minimal. Future monetization packages
# (google_mobile_ads, in_app_purchase, firebase_analytics) are added
# only when you enable them - see README.md.
dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/
